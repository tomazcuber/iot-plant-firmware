# Bench instrument: own Kconfig, nothing shared with the measured builds.
CONFIG_PM=n
CONFIG_WIFI=n
CONFIG_BT=n

# Console stays on UART0 (CH343 port); data goes over the native USB-Serial/JTAG.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LOG=n

# 50 us tick so a 500 us k_timer period is exact (RD-05).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_MAIN_THREAD_PRIORITY=7
