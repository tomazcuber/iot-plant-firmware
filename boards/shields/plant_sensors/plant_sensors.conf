CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
# Sensors return to low power after each measurement (SM-11). The driver
# default is normal mode, which keeps measuring through deep sleep.
CONFIG_BME280_MODE_FORCED=y
CONFIG_PLANT_SENSORS=y
# Two-point soil calibration (DD-MA-12), characterised for the deployed probe.
# Record these values in the thesis methodology.
# This file is the only place the calibration is set.
# Dry air, 2026-11-21 with sensors-smoke: mean 3059 (n=14, SD 4).
# Submerged, 2026-11-22 with main: median 1381 (logger rows 1900-2677, n=778,
# SD 5.5) over about 14 hours. Readings take hours to settle and moved by
# hundreds of counts early in the soak, so soak for at least 3 hours when
# recharacterising.
CONFIG_PLANT_SOIL_DRY_ADC=3059
CONFIG_PLANT_SOIL_WET_ADC=1381
