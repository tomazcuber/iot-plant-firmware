CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
# Sensors return to low power after each measurement (SM-11). The driver
# default is normal mode, which keeps measuring through deep sleep.
CONFIG_BME280_MODE_FORCED=y
CONFIG_PLANT_SENSORS=y
# Two-point soil calibration (DD-MA-12). Replace with values characterised
# for the deployed probe; record them in the thesis methodology.
# This file is the only place the calibration is set.
# Measured 2026-11-21 with sensors-smoke. Dry air: mean 3059 (n=14, SD 4).
# Submerged: settled means 1071 and 1152 over two insertions (last 5 samples
# of each). WET_ADC is their midpoint. Submerged readings climb for about a
# minute, so let them settle when recharacterising.
CONFIG_PLANT_SOIL_DRY_ADC=3059
CONFIG_PLANT_SOIL_WET_ADC=1111
