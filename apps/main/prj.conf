# App-local symbols only. Sensor and network symbols come from the
# plant_sensors shield and the plant-net snippet (SM-05).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_BT=n
# System power management stays off (ADR-0006): its idle policy enters
# light sleep with no wake source during network waits and the device
# stops (static-sleep DD-SS-03; bench, 2026-11-19).
CONFIG_PM=n
# Sleep is reached with sys_poweroff() (as in apps/static-sleep and
# samples/boards/espressif/deep_sleep).
CONFIG_POWEROFF=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
