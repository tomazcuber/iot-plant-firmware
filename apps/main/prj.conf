# App-local symbols only. Sensor and network symbols come from the
# plant_sensors shield and the plant-net snippet (SM-05).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_BT=n
# System power management stays on in main (ADR-0006).
CONFIG_PM=y
# Sleep is reached with sys_poweroff() (as in apps/static-sleep).
CONFIG_POWEROFF=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
