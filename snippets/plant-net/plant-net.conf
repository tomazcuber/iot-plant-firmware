# Shared network stack (SM-14, ADR-0006). Merged after prj.conf: apps must not
# set any of these symbols themselves (SM-05).
# plant_json is needed by every app that publishes; the net snippet owns it so
# the payload encoder is identical across apps.
CONFIG_PLANT_JSON=y
CONFIG_PLANT_NET=y

# Float formatting for snprintf (plant_json); picolibc is the default libc
CONFIG_PICOLIBC_IO_FLOAT=y

# Network stack
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_MQTT_LIB=y
CONFIG_SNTP=y

# Resources the stack needs (heap for the WiFi blobs, buffers, stacks)
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONN=4
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_ZVFS_OPEN_MAX=8

# DNS servers come from the DHCP lease
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y

# Shared stack settings (ADR-0006)
CONFIG_PLANT_NET_WIFI_PS_MIN_MODEM=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_PLANT_NET_MQTT_PORT=1883
CONFIG_PLANT_NET_SNTP_SERVER="pool.ntp.org"
